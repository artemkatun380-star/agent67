<!doctype html>
<html lang="ru">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent 67 — Миссия</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <script>
      // Минимальная инициализация SDK
      YaGames.init().then(function (ysdk) {
        console.log("Яндекс.Игры SDK готов");
        // Здесь позже можно добавить рекламу или сохранения, если захочешь
        // Например, сохранить ссылку на ysdk в глобальную переменную
        window.ysdk = ysdk;
      });
    </script>
  </head>
  <body>
    <div id="loadingScreen">
      <div class="loading-content">
        <h2>AGENT 67</h2>
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
        <p id="loadingText">Загрузка... 0%</p>
      </div>
    </div>
    <button id="fullscreenBtn" title="На весь экран">⛶</button>
    <div id="rotateHint">
      <p class="rotate-text-top">пожалуйста</p>
      <p class="rotate-text-bottom">переверните телефон</p>
      <img
        src="images/rotate.png"
        alt="Поворот телефона"
        class="rotate-image"
      />
    </div>
    <!-- Главное меню -->
    <div id="menuScreen">
      <h1>AGENT 67</h1>
      <button id="playButton">ИГРАТЬ</button>
    </div>

    <!-- Выбор уровня -->
    <div id="levelSelectScreen" style="display: none">
      <h2>ВЫБОР УРОВНЯ</h2>
      <div id="levelGrid"></div>
      <button id="backButton">НАЗАД</button>
    </div>

    <!-- Игровой экран -->
    <canvas id="gameCanvas" style="display: none"></canvas>
    <button id="restartButton">ЗАНОВО</button>
    <button id="levelSelectButton" style="display: none">ВЫБОР УРОВНЕЙ</button>
    <div id="victoryScreen">
      <img id="victoryImage" src="images/victory.png" alt="Victory" />
      <p>АГЕНТ 67 СНОВА СПАС МИР...</p>
    </div>

    <script src="script.js?v=50"></script>
  </body>
</html>
